<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07050d">
  <title>Nexum</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles/base/tokens.css">
  <link rel="stylesheet" href="styles/base/reset.css">
  <link rel="stylesheet" href="styles/base/components.css">
  <link rel="stylesheet" href="styles/pages/splash.css">
  <script src="js/api.js"></script>
  <script src="js/mock.js"></script>
  <script>
    // Splash já vista nesta sessão: vai direto, sem animação
    (function () {
      var vista = false;
      try { vista = sessionStorage.getItem('nexum-splash-vista') === '1'; } catch (e) {}
      if (!vista) return;
      document.documentElement.classList.add('sp-skip');
      window.location.replace(estaLogado() ? 'pages/dashboard.html' : 'pages/login.html');
    })();
  </script>
</head>
<body>
  <main class="sp" id="sp">
    <div class="sp-bg" aria-hidden="true">
      <div class="sp-orb sp-orb-1"></div>
      <div class="sp-orb sp-orb-2"></div>
      <div class="sp-orb sp-orb-3"></div>
      <div class="sp-orb sp-orb-4"></div>
      <div class="sp-orb sp-orb-5"></div>
      <div class="sp-vignette"></div>
      <div class="sp-grain"></div>
    </div>

    <div class="sp-content">
      <div class="sp-logo">
        <span class="sp-glow" aria-hidden="true"></span>
        <img class="sp-logo-img" src="assets/logo/logo-96.svg" width="104" height="104" alt="">
        <!-- Contorno do "N" (mesmas coordenadas do N em assets/logo/logo-96.svg) -->
        <svg class="sp-n" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
          <path pathLength="1" d="M24 30.925C24 24.975 26.0741 22 30.2222 22H47.2642L59 65.575V22H71V64.075C71 70.025 68.8462 73 64.5385 73H47.2642L36 32.726V73H24Z"/>
        </svg>
      </div>

      <h1 class="sp-title">Nexum</h1>
      <p class="sp-sub">Finanças com clareza</p>

      <div class="sp-bar" id="sp-bar" role="progressbar" aria-label="Carregando Nexum"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="sp-bar-fill"></div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      if (document.documentElement.classList.contains('sp-skip')) return;

      var reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var TOTAL = reduz ? 1000 : 2500;            // depois disso: fade-out de 250ms e redireciona
      var BARRA_INI = reduz ? 100 : 300;          // mesma janela da animação da barra no CSS
      var BARRA_FIM = reduz ? 900 : 2400;
      var sp = document.getElementById('sp');
      var bar = document.getElementById('sp-bar');
      var t0 = performance.now();

      // aria-valuenow acompanhando a barra
      (function tick() {
        var p = Math.min(1, Math.max(0, (performance.now() - t0 - BARRA_INI) / (BARRA_FIM - BARRA_INI)));
        bar.setAttribute('aria-valuenow', String(Math.round(p * 100)));
        if (p < 1) requestAnimationFrame(tick);
      })();

      setTimeout(function () {
        try { sessionStorage.setItem('nexum-splash-vista', '1'); } catch (e) {}
        sp.classList.add('is-leaving');
        setTimeout(function () {
          window.location.replace(estaLogado() ? 'pages/dashboard.html' : 'pages/login.html');
        }, 250);
      }, TOTAL);
    })();
  </script>
</body>
</html>
