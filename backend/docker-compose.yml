# Postgres 16 para desenvolvimento local.
# Uso (de dentro de backend/):  docker compose up -d
#
# Usuário e senha vêm do backend/.env (DB_USER e DB_PASSWORD), o mesmo arquivo que a API lê.
# Os dados ficam no volume "nexum-pgdata" e sobrevivem a "docker compose down".
# Para apagar tudo e começar do zero:  docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexum
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - nexum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d nexum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexum-pgdata:
