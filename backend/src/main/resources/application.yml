# Configuração da API. TUDO que é segredo ou muda por ambiente vem de variável de ambiente.
# Em dev local, as variáveis podem ficar no arquivo backend/.env (veja .env.example):
# o "spring.config.import" abaixo lê esse arquivo se ele existir. No Render não há .env:
# as variáveis são cadastradas no painel do serviço.

spring:
  application:
    name: nexum-api
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Plano grátis do Neon: poucas conexões. 5 sobram para uma API pequena.
      maximum-pool-size: 5
      # Sem conexão parada aberta: deixa o Neon "dormir" quando ninguém usa (economiza horas de compute).
      minimum-idle: 0
      idle-timeout: 60000        # fecha conexão ociosa depois de 1 min
      max-lifetime: 300000       # recicla cada conexão a cada 5 min (o Neon derruba conexões antigas)
      connection-timeout: 20000  # 20 s: dá tempo do Neon "acordar"

  jpa:
    # Quem cria e altera tabelas é o Flyway. O Hibernate só confere se as entidades batem com o banco.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # JSON em snake_case (id_usuario, valor_alvo...), igual ao que o front já usa.
    # No Java os campos ficam em camelCase (idUsuario, valorAlvo) e a conversão é automática.
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  # Fuso usado para definir "o mês" do usuário (o banco guarda tudo em UTC).
  fuso-horario: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    # Mínimo de 32 caracteres. Gere com: openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  cors:
    # Lista separada por vírgula, sem barra no final.
    origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
