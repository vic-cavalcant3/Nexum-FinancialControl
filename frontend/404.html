<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Nexum — Página não encontrada</title>
  <!-- O Render serve este arquivo em qualquer URL inexistente (ex.: /pages/xyz/abc).
       Para os caminhos relativos funcionarem de qualquer profundidade, o <base> aponta para a
       raiz do site: "/" no deploy, ou ".../frontend/" quando aberto localmente. -->
  <script>
    (function () {
      var p = window.location.pathname;
      var i = p.indexOf('/frontend/');
      var raiz = i !== -1 ? p.slice(0, i + '/frontend/'.length) : '/';
      document.write('<base href="' + raiz + '">');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="styles/base/tokens.css">
  <link rel="stylesheet" href="styles/base/reset.css">
  <link rel="stylesheet" href="styles/base/components.css">
  <link rel="stylesheet" href="styles/pages/not-found.css">
</head>
<body>
  <main class="splash">
    <div class="ellipse ellipse-1" aria-hidden="true"><img src="assets/splash/ellipse-1.svg" alt=""></div>
    <div class="ellipse ellipse-2" aria-hidden="true"><img src="assets/splash/ellipse-2.svg" alt=""></div>
    <div class="ellipse ellipse-3" aria-hidden="true"><img src="assets/splash/ellipse-3.svg" alt=""></div>
    <div class="ellipse ellipse-4" aria-hidden="true"><img src="assets/splash/ellipse-4.svg" alt=""></div>

    <div class="splash-content">
      <img src="assets/logo/logo-96.svg" width="96" height="96" alt="">
      <h1 class="splash-title">Página não encontrada</h1>
      <p class="splash-subtitle">O endereço que você acessou não existe.</p>
      <a class="btn btn-secondary" href="index.html">Voltar ao início</a>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/mock.js"></script>
</body>
</html>
