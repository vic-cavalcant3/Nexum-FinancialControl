<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Dicas — Nexum</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <script src="../js/theme.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/mock.js"></script>
  <script>redirecionarSeNaoLogado();</script>
  <link rel="stylesheet" href="../styles/base/tokens.css">
  <link rel="stylesheet" href="../styles/base/reset.css">
  <link rel="stylesheet" href="../styles/base/components.css">
  <link rel="stylesheet" href="../styles/layout/shell.css">
  <link rel="stylesheet" href="../styles/pages/dicas.css">
</head>
<body>
  <main class="app-main app-main--surface">
    <div class="page dcp" id="dcp">
      <header class="ph">
        <div class="ph-text">
          <h1 class="ph-title">Dicas</h1>
          <p class="ph-sub only-d">Livros, vídeos, podcasts, cursos e ferramentas para cuidar melhor do seu dinheiro.</p>
          <p class="ph-sub dc-updated" id="dc-updated"></p>
        </div>
      </header>

      <div class="dc-body">
        <div class="dc-filters" id="dc-filters" role="tablist" aria-label="Filtrar dicas">
          <button type="button" role="tab" class="dc-chip" data-f="todos" data-icon="tip-grid">Todos</button>
          <button type="button" role="tab" class="dc-chip" data-f="livros" data-icon="tip-book">Livros</button>
          <button type="button" role="tab" class="dc-chip" data-f="videos" data-icon="tip-play">Vídeos</button>
          <button type="button" role="tab" class="dc-chip" data-f="podcasts" data-icon="tip-other">Podcasts</button>
          <button type="button" role="tab" class="dc-chip" data-f="cursos" data-icon="goal-cap">Cursos grátis</button>
          <button type="button" role="tab" class="dc-chip" data-f="ferramentas" data-icon="goal-shield">Ferramentas</button>
        </div>

        <ol class="dc-timeline" id="dc-timeline" aria-live="polite"></ol>
      </div>
    </div>
  </main>

  <script src="../js/icons.js"></script>
  <script src="../js/layout.js"></script>
  <script>renderLayout('dicas');</script>
  <script src="../js/util.js"></script>
  <script src="../js/data/dicas.js"></script>
  <script src="../js/pages/dicas.js"></script>
</body>
</html>
