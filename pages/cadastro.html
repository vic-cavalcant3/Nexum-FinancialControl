<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro — Nexum</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/base/global.css">
  <link rel="icon" type="image/svg+xml" href="../components/image/nexum-icon.svg">

    <!-- GLOBAL -->
    <link rel="stylesheet" href="../styles/base/global.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nexum: {
              purple: '#4A0789',
              'purple-bright': '#A78BFA',
              'purple-deep': '#6D28D9',
              dark: '#0A0A0A',
              'dark-2': '#111111',
              'dark-3': '#1A1A1A',
              'dark-card': '#141414',
              'dark-border': '#2A2A2A',
            }
          },
          fontFamily: {
            manrope: ['Manrope', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Manrope', sans-serif;
      background-color: #0A0A0A;
      color: #F5F5F5;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.35;
    }

    /* Lado esquerdo */
    .left-panel {
      background: #0D0D0D;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      padding-left: 80px;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(139,92,246,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Lado direito */
    .right-panel {
      background: #111111;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 1px solid #1E1E1E;
    }

    /* Input */
    .form-input {
      width: 100%;
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 8px;
      padding: 12px 16px;
      color: #F5F5F5;
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .form-input::placeholder { color: #4B5563; }
    .form-input:focus { border-color: #4A0789; }

    /* Botão primário */
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #4A0789, #6D28D9);
      color: white;
      padding: 13px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 24px rgba(139,92,246,0.25);
    }
    .btn-primary:hover {
      box-shadow: 0 0 36px rgba(139,92,246,0.45);
      transform: translateY(-1px);
    }

    /* Botão social */
    .btn-social {
      flex: 1;
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 8px;
      padding: 11px 16px;
      color: #D1D5DB;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }
    .btn-social:hover {
      border-color: #3A3A3A;
      color: #F5F5F5;
    }

    /* Divider OR */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #4B5563;
      font-size: 0.75rem;
      font-family: 'Inter', sans-serif;
    }
    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2A2A2A;
    }

    /* Checkbox */
    .form-checkbox {
      width: 15px;
      height: 15px;
      accent-color: #4A0789;
      cursor: pointer;
    }

    /* Text gradient */
    .text-gradient {
      background: linear-gradient(135deg, #A78BFA, #7C3AED);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

 

    /* Footer links */
    .footer-link-sm {
      color: #4B5563;
      font-size: 0.72rem;
      font-family: 'Inter', sans-serif;
      transition: color 0.2s;
    }
    .footer-link-sm:hover { color: #9CA3AF; }

    /* Responsive */
    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .left-panel { display: none; }
    }
  </style>
  <script src="../js/api.js"></script>
</head>
<body>

  <!-- ══════ PAINEL ESQUERDO ══════ -->
  <div class="left-panel">
    <!-- Logo -->
    <a href="../index.html" class="nexum-logo">NEXUM</a>

    <!-- Headline central -->
    <div>
      <h2 class="text-7xl font-extrabold leading-tight tracking-tight mb-4">
        Simplicidade<br />
        para sua <span class="text-gradient">jornada<br />financeira.</span>
      </h2>
      <p class="text-gray-500 text-sm font-inter font-light leading-relaxed max-w-xs">
        Uma plataforma pensada para pessoas, não apenas números. Controle seu patrimônio com a clareza que você merece.
      </p>
    </div>

    <!-- Footer links esquerdo -->
    <div class="flex items-center gap-5">
      <a href="#" class="footer-link-sm">Privacidade</a>
      <a href="#" class="footer-link-sm">Termos</a>
      <a href="#" class="footer-link-sm">Suporte</a>
    </div>
  </div>


  <!-- ══════ PAINEL DIREITO — FORM ══════ -->
  <div class="right-panel">
    <div class="max-w-sm w-full mx-auto flex flex-col gap-6">

      <!-- Header -->
      <div>
        <h1 class="text-4xl font-bold tracking-tight mb-1">Bem-vindo de volta</h1>
        <p class="text-gray-500 text-sm font-inter font-light">Acesse sua conta para continuar.</p>
      </div>

      <!-- Form -->
      <div class="flex flex-col gap-4">

        <!-- Nome -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-gray-300 font-inter">Nome Completo</label>
          <input type="text" class="form-input" placeholder="Victor Vicentinni" />
        </div>

           <!-- E-mail -->
           <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-gray-300 font-inter">Email</label>
            <input type="email" class="form-input" placeholder="admin123@gmail.com" />
          </div>

        <!-- Senha -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-gray-300 font-inter">Senha</label>
          <div class="relative">
            <input type="password" id="password" class="form-input pr-10" placeholder="••••••••" />
            <button onclick="togglePassword('password', 'eye-login')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors">
              <span class="material-icons-round" id="eye-login" style="font-size:18px;">visibility_off</span>
            </button>
          </div>
        </div>

        <!-- Confirmar Senha -->
<div class="flex flex-col gap-1.5">
    <label class="text-xs font-semibold text-gray-300 font-inter">Confirmar senha</label>
    <div class="relative">
      <input type="password" id="confirm-password" class="form-input pr-10" placeholder="••••••••" />
      <button onclick="togglePassword('confirm-password', 'eye-confirm')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors">
        <span class="material-icons-round" id="eye-confirm" style="font-size:18px;">visibility_off</span>
      </button>
    </div>
  </div>

        <!-- Lembrar / Esqueceu -->
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="form-checkbox" />
            <span class="text-xs text-gray-400 font-inter">Lembrar de mim</span>
          </label>
    
        </div>

        <!-- Submit -->
        <button id="btn-cadastro" class="btn-primary mt-1">
          Criar Conta
        </button>

        <!-- OR -->
        <div class="or-divider">OU</div>

        <!-- Social -->
        <div class="flex gap-3">
          <button class="btn-social">
            <!-- Google icon SVG simples -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          <button class="btn-social">
            <!-- Facebook icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Facebook
          </button>
        </div>

        <!-- Cadastro -->
        <p class="text-center text-xs text-gray-500 font-inter">
          Ja possui uma conta?
          <a href="login.html" style="color:#A78BFA;" class="hover:underline font-medium">Entrar</a>
        </p>

      </div>
    </div>
  </div>

  <script>
  document.querySelector('button.btn-primary, button[type="submit"]')
    ?.addEventListener('click', async function(e) {
      e.preventDefault();

      const nome  = document.querySelector('input[type="text"]')?.value?.trim();
      const email = document.querySelector('input[type="email"]')?.value?.trim();
      const senha = document.querySelector('input[type="password"]')?.value;

      if (!nome || !email || !senha) {
        alert('Preencha todos os campos.');
        return;
      }

      this.textContent = 'Criando conta...';
      this.disabled = true;

      try {
        await Auth.registrar(nome, email, senha);
        alert('Conta criada! Faça login para continuar.');
        window.location.href = 'login.html';
      } catch (err) {
  const msg = err.message.includes('reach') || err.message.includes('connect') || err.message.includes('P1001')
    ? 'Servidor temporariamente indisponível. Tente novamente mais tarde.'
    : err.message.includes('cadastrado')
    ? 'Este e-mail já está cadastrado.'
    : 'Não foi possível criar a conta. Tente novamente.';
  alert(msg);
  this.textContent = 'Criar Conta';
  this.disabled = false;
}
    });

function togglePassword(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);

  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility_off';
  }
}
  </script>

</body>
</html>
